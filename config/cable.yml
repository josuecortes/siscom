# Solid Cable no banco principal (mesmo em desenvolvimento, para que jobs e
# console consigam transmitir Turbo Streams para o navegador).
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

# No teste, o adapter em memória entrega de verdade entre navegadores do mesmo
# processo (specs de sistema de tempo real).
test:
  adapter: async

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
