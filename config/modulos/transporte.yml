# Catálogo do módulo Transporte (porta do Transport do seed; plano 02 §5). Decisões do Josue em 2026-10-05:
# motorista é um usuário com o papel `motorista` (como no seed); não existe tipo "urgente" (pedido fora do
# prazo é aberto pela operação); motoristas e veículos são recadastrados; transporte escolar fica fora.
nome: "Transporte"
icone: "car-alt"

permissoes:
  solicitacoes.abrir: "Abrir e acompanhar as próprias solicitações de transporte"
  solicitacoes.operar: "Ver a operação, abrir para outra pessoa, reagendar e registrar observações"
  solicitacoes.aprovar: "Aprovar e cancelar solicitações"
  servico.executar: "Iniciar e finalizar o serviço como motorista"
  motoristas.gerenciar: "Cadastrar e editar motoristas"
  veiculos.gerenciar: "Cadastrar e editar veículos"
  relatorios.ver: "Ver relatórios do transporte"
  configuracoes.gerenciar: "Gerenciar as configurações do transporte (janelas e alertas)"
  permissoes.conceder: "Conceder permissões no Transporte"

papeis:
  admin:
    nome: "Administrador"
    permissoes: "*"
  tecnico:
    nome: "Técnico"
    permissoes: [solicitacoes.abrir, solicitacoes.operar, solicitacoes.aprovar, motoristas.gerenciar, veiculos.gerenciar, relatorios.ver, permissoes.conceder]
  motorista:
    nome: "Motorista"
    permissoes: [solicitacoes.abrir, servico.executar]
  # Não é automático (decisão do Josue): só pede transporte quem tem a permissão, como no siscom antigo
  # (`req_serv_tp`, migrado por `remaster:transporte:importar_papeis`).
  solicitante:
    nome: "Solicitante"
    permissoes: [solicitacoes.abrir]

concessao:
  admin: [admin, tecnico, motorista, solicitante]
  tecnico: [motorista, solicitante] # motorista: ao cadastrar um; solicitante: como no seed

menu:
  - { rotulo: "Solicitações de transporte", rota: transporte_solicitacoes_path, permissao: solicitacoes.abrir, icone: car-alt, minha_area: true }
  - { rotulo: "Meus serviços", rota: transporte_servicos_path, permissao: servico.executar, icone: speedometer }
  - { rotulo: "Operação", rota: transporte_operacao_index_path, permissao: solicitacoes.operar, icone: group }
  - { rotulo: "Abrir para outra pessoa", rota: new_transporte_solicitacao_para_outro_path, permissao: solicitacoes.operar, icone: user-follow }
  - { rotulo: "Motoristas", rota: transporte_motoristas_path, permissao: motoristas.gerenciar, icone: people }
  - { rotulo: "Veículos", rota: transporte_veiculos_path, permissao: veiculos.gerenciar, icone: car-alt }
  - { rotulo: "Permissões", rota: transporte_permissoes_path, permissao: permissoes.conceder, icone: shield-alt }
  - { rotulo: "Configuração", rota: transporte_configuracoes_path, permissao: configuracoes.gerenciar, icone: settings }
