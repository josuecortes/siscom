# Alertas do Transporte (lembrete de saída e busca atrasada): valem em produção e no desenvolvimento.
alertas_do_transporte: &alertas_do_transporte
  transporte_alertas:
    class: Transporte::AlertasJob
    schedule: every minute

development:
  <<: *alertas_do_transporte

production:
  <<: *alertas_do_transporte
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
